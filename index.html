
<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: navy;
            margin-top: 40px;
        }

        .game {
            margin: auto;
            display: grid;
            grid-template-columns: 80px 80px 80px;
            gap: 5px;
            width: 250px;
        }

        .box {
            height: 80px;
            font-size: 30px;
            background-color: white;
            border: 2px solid navy;
            cursor: pointer;
        }

        button:hover {
            background-color: lightgray;
        }

        #result {
            color: navy;
        }

        .restart {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: navy;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe Game</h1>

    <h3 id="result">Player X Turn</h3>

    <div class="game">
        <button class="box" onclick="check(0)"></button>
        <button class="box" onclick="check(1)"></button>
        <button class="box" onclick="check(2)"></button>
        <button class="box" onclick="check(3)"></button>
        <button class="box" onclick="check(4)"></button>
        <button class="box" onclick="check(5)"></button>
        <button class="box" onclick="check(6)"></button>
        <button class="box" onclick="check(7)"></button>
        <button class="box" onclick="check(8)"></button>
    </div>

    <button class="restart" onclick="location.reload()">
        Restart Game
    </button>

    <script>
        let turn = "X";
        let arr = ["", "", "", "", "", "", "", "", ""];
        let boxes = document.querySelectorAll(".box");
        let result = document.getElementById("result");
        let over = false;

        let win = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        function check(i) {

            if (arr[i] != "" || over == true) {
                return;
            }

            arr[i] = turn;
            boxes[i].innerText = turn;

            let won = false;

            for (let j = 0; j < win.length; j++) {
                let a = win[j];

                if (arr[a[0]] == turn &&
                    arr[a[1]] == turn &&
                    arr[a[2]] == turn) {
                    won = true;
                }
            }

            if (won) {
                result.innerText = "Player " + turn + " Wins!";
                over = true;
            }
            else if (!arr.includes("")) {
                result.innerText = "Match Draw!";
                over = true;
            }
            else {
                if (turn == "X") {
                    turn = "O";
                }
                else {
                    turn = "X";
                }

                result.innerText = "Player " + turn + " Turn";
            }
        }
    </script>

</body>
</html>
